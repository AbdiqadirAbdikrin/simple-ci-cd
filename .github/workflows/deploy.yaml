name: Build and Push Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -f Dockerfile \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/task-management-api:latest" \
            ./NodeJS

      - name: Push image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/task-management-api:latest"